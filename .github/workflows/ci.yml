name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint self-test (dummy term)
        run: npm run test:lint
      - name: Colour contrast (design tokens)
        run: npm run test:contrast
      - name: Banned-terms lint (source)
        run: npm run lint:banned
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Banned-terms lint (built output)
        run: node scripts/lint-banned.mjs --dir dist
      - name: Accessibility (pa11y, WCAG2AA)
        run: |
          node node_modules/astro/bin/astro.mjs preview --port 4321 &
          sleep 5
          npm run test:a11y
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Runs only on pushes to main, after the build job passes.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
